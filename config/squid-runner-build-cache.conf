# Optional developer dependency proxy. It listens only on loopback.
http_port 127.0.0.1:3128
acl localhost src 127.0.0.1/32 ::1
acl CONNECT method CONNECT
http_access allow localhost
http_access deny all

# CONNECT is a blind HTTPS tunnel. No TLS interception is configured and its
# content is not cached. This cache can store only ordinary cacheable HTTP.
cache deny CONNECT
cache_dir rock @CACHE_DIR@ 4096 max-size=1048576
cache_mem 256 MB
maximum_object_size 1024 MB
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
