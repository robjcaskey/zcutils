namespace:
  create: false
  name: ""

nameOverride: ""
fullnameOverride: ""

driverName: io.zcutils.zcblock

image:
  repository: docker.io/robjcaskey/zcblock-csi
  tag: nightly
  # When set, this takes precedence over tag for every first-party DaemonSet
  # container, including the node-setup init container.
  digest: ""
  pullPolicy: IfNotPresent

sidecars:
  provisioner:
    image:
      repository: registry.k8s.io/sig-storage/csi-provisioner
      tag: v5.3.0
      pullPolicy: IfNotPresent
    timeout: 60s
    logLevel: 3
  snapshotter:
    image:
      repository: registry.k8s.io/sig-storage/csi-snapshotter
      tag: v8.3.0
      pullPolicy: IfNotPresent
    timeout: 600s
    logLevel: 3
    extraCreateMetadata: true
  registrar:
    image:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      tag: v2.16.0
      pullPolicy: IfNotPresent
    logLevel: 3

serviceAccount:
  create: true
  name: ""

rbac:
  create: true

security:
  readOnlyRootFilesystem: true

csidriver:
  create: true
  fsGroupPolicy: File

daemonset:
  priorityClassName: system-node-critical
  podAnnotations: {}
  nodeSelector: {}
  tolerations:
    - operator: Exists
  affinity: {}

# TCP is always available to userspace volume stages. Enable this gate when
# nodes are also expected to run RDMA stages: the DaemonSet then refuses to
# become Ready unless the declared libfabric provider and an active device are
# visible. This does not change the kernel edge, which remains transport=shm.
backplane:
  rdma:
    enabled: false
    provider: efa
    domain: ""

# The CSI node Pod does not start until this idempotent init container has
# prepared the zcnblk client edge on its host. Production installs select an
# explicit prebuilt module source and never silently fall back to compilation.
# Disable this when another node lifecycle manager loads the module.
nodeSetup:
  enabled: true
  # The init container always uses the normal DaemonSet image. That image
  # contains the Rust loader and its architecture-local exact-ABI bundle.
  # Install kmod only when a selected node image lacks insmod/modinfo. This is
  # independent of development compilation and is disabled by default so a
  # production install does not mutate the host package set unexpectedly.
  installModuleTools: false
  existingConfigMap: ""
  parametersKey: module-parameters
  moduleSource:
    # host, image, http, or build. There is deliberately no automatic fallback
    # from a missing production artifact to an on-node source build.
    type: image
    # %KERNEL_RELEASE% and %ARCH% are expanded by the init container. `host`
    # paths are viewed under /host; `image` paths are inside the DaemonSet image.
    hostPathTemplate: /opt/zcutils/kmods/zcnblk_client_mod.ko
    imagePathTemplate: /opt/zcutils/kmods/%ARCH%/%KERNEL_RELEASE%/zcnblk_client_mod.ko
    http:
      # Intended for a user-provided static HTTP(S) origin. The same template
      # tokens are supported in the artifact and checksum URLs.
      urlTemplate: ""
      # Set one pinned digest, or serve a sha256sum-style file at
      # checksumUrlTemplate. One of these is mandatory in http mode.
      sha256: ""
      checksumUrlTemplate: ""
      allowInsecureHttp: false
      connectTimeoutSeconds: 5
      totalTimeoutSeconds: 60
      # nodeCacheDaemonSet downloads with ordinary pod networking and relays
      # through a verified host cache, avoiding any dependency on host-network
      # access to ClusterIP Services. `direct` downloads in the loader itself.
      delivery: nodeCacheDaemonSet
      cacheWaitSeconds: 300
      refreshSeconds: 300
    # Optional additional content pin for host/image artifacts. OCI images
    # should also be selected by immutable digest in production.
    sha256: ""
    cacheRoot: /var/lib/zccusan/kmods
  # On-node compilation is an explicit development/debugging facility. It is
  # accepted only with moduleSource.type=build and enabled=true.
  developmentBuild:
    enabled: false
    installHostDependencies: false
    sourceConfigMap: ""
    buildRoot: /var/lib/zccusan/kmods/build
  resources: {}
  module:
    parameters:
      - transport=shm
      - lanes=1
      - connections_per_lane=1
      - shard_count=1
      - size_mib=256
      - logical_block_size=4096
      - max_frame_bytes=4096
      - queues=1
      - queue_depth=128
      - pipeline_depth=128
      - shm_ring_entries=256
      - shm_payload_entries=4096
      - shm_poll_us=1000
      - batch_depth=1
      - write_acks=1
      - hctx_affinity=0
      - pin_threads=0

stateDir: /var/lib/zcblock-csi
userspaceMountRoot: /var/lib/zcutils/userspace-volumes
pluginDir: ""
kubeletDir: /var/lib/kubelet
registrationDir: /var/lib/kubelet/plugins_registry
configfsDir: /sys/kernel/config
devDir: /dev

control:
  enabled: true
  listen: 127.0.0.1:9788
  url: http://127.0.0.1:9788

operator:
  enabled: true
  waitTimeoutMs: 50000
  runtimePerformance:
    enabled: false
    leafCpuList: ""
    fanCpuList: ""
    onrampCpuList: ""
    ofiCqSleepNs: "0"
  resources: {}

telemetry:
  apiEndpoint: ""

communitySurvey:
  enabled: true
  apiEndpoint: "https://vdq4ma9dl2.execute-api.us-east-1.amazonaws.com/survey"

telemetryServer:
  enabled: true
  port: 9899
  flushIntervalMs: 750
  requestTimeoutMs: 500
  replicas: 1
  resources: {}

logstream:
  path: ""

metrics:
  enabled: false
  port: 9788
  path: /metrics
  annotations: {}

freezeMaxTtlMs: 5000
snapshotMode: auto

installation:
  enabled: true
  id: ""

storageClasses:
  zcbrd:
    enabled: true
    name: zcbrd
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: false
    parameters:
      backend: zcbrd
      blocksize: "4096"
      queues: "8"
      queueDepth: "512"
      descriptorMode: advertise
  zcfile:
    enabled: true
    name: zcfile
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: false
    parameters:
      backend: file-loop
  zcfabric:
    enabled: false
    name: zcfabric
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: false
    annotations:
      zcutils.io/fabric-prerequisite: "Every eligible client node must expose /dev/zcnblk0 connected to the selected userspace volume stage."
    parameters:
      backend: fabric
      rawDevice: /dev/zcnblk0
  zcuserspace:
    enabled: false
    name: zcuserspace
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: false
    annotations:
      zcutils.io/userspace-mount-prerequisite: "A node-local userspace filesystem service must mount each logical volume beneath userspaceMountRoot before NodeStageVolume."
    parameters:
      backend: userspace-mount
  zcraw:
    enabled: false
    name: zcraw
    reclaimPolicy: Delete
    volumeBindingMode: WaitForFirstConsumer
    allowVolumeExpansion: false
    annotations:
      zcutils.io/raw-block-warning: "Only use with volumeMode: Block. The raw device is not formatted or wiped by the CSI driver."
    parameters:
      backend: raw-block
      rawPartUUID: ""
