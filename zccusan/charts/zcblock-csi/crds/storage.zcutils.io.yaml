      openAPIV3Schema:
        description: Auto-generated derived type for StorageProfileSpec via `CustomResource`
        properties:
          spec:
            properties:
              enabled:
                default: true
                type: boolean
              frontend:
                default: LinuxBlock
                type: string
              placement:
                properties:
                  copies:
                    default: 2
                    format: uint16
                    minimum: 0.0
                    type: integer
                  distinctTopologyKeys:
                    default: []
                    items:
                      type: string
                    type: array
                  excludeClientNode:
                    default: true
                    type: boolean
                  execution:
                    default: Userspace
                    type: string
                  mediaClass:
                    type: string
                  primitive:
                    default: Mirror
                    type: string
                required:
                - mediaClass
                type: object
              storageClass:
                nullable: true
                properties:
                  isDefault:
                    default: false
                    type: boolean
                  name:
                    type: string
                required:
                - name
                type: object
              tieringPolicyRef:
                nullable: true
                type: string
              transport:
                default:
                  addressSource: NodeAnnotationThenInternalIP
                  chunkBytes: 4096
                  connectionsPerLane: 1
                  deviceResourceName: null
                  kind: TcpMux
                  lanes: 1
                  nodeAddressAnnotation: storage.zcutils.io/backplane-address
                  ofiDomainAnnotation: storage.zcutils.io/ofi-domains
                  ofiEndpoint: rdm
                  ofiProvider: efa
                  requireOneSidedRma: false
                properties:
                  addressSource:
                    default: NodeAnnotationThenInternalIP
                    type: string
                  chunkBytes:
                    default: 4096
                    format: uint32
                    minimum: 0.0
                    type: integer
                  connectionsPerLane:
                    default: 1
                    format: uint16
                    minimum: 0.0
                    type: integer
                  deviceResourceName:
                    description: Kubernetes extended resource handed out by the installed RDMA device plugin, such as vpc.amazonaws.com/efa. OfiRdm profiles require it so the operator can prove every selected node owns a usable device.
                    nullable: true
                    type: string
                  kind:
                    default: TcpMux
                    type: string
                  lanes:
                    default: 1
                    format: uint16
                    minimum: 0.0
                    type: integer
                  nodeAddressAnnotation:
                    default: storage.zcutils.io/backplane-address
                    type: string
                  ofiDomainAnnotation:
                    default: storage.zcutils.io/ofi-domains
                    description: Optional node annotation whose comma-separated values map lanes to libfabric domains. Absence means provider-selected locality.
                    type: string
                  ofiEndpoint:
                    default: rdm
                    type: string
                  ofiProvider:
                    default: efa
                    description: Libfabric provider used when kind=OfiRdm (for example efa, verbs, or sockets for a non-representative software smoke).
                    type: string
                  requireOneSidedRma:
                    default: false
                    description: Reserved for the one-sided registered-arena fast path. The current mirror rejects true rather than allowing a payload to bypass a leg.
                    type: boolean
                type: object
            required:
            - placement
            type: object
          status:
            nullable: true
            properties:
              message:
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              phase:
                default: ''
                type: string
              storageClassName:
                nullable: true
                type: string
            type: object
        required:
        - spec
        title: StorageProfile
        type: object
    served: true
    storage: true
    subresources:
      status: {}
