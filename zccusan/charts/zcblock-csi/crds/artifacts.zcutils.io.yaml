apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zccusankernelmodulesources.artifacts.zcutils.io
spec:
  group: artifacts.zcutils.io
  names:
    categories: []
    kind: ZccusanKernelModuleSource
    plural: zccusankernelmodulesources
    shortNames:
    - zckms
    singular: zccusankernelmodulesource
  scope: Cluster
  versions:
  - additionalPrinterColumns: []
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Auto-generated derived type for ZccusanKernelModuleSourceSpec via `CustomResource`
        properties:
          spec:
            properties:
              catalogRefs:
                description: Signed catalogs accepted through these origins.
                items:
                  properties:
                    name:
                      type: string
                  required:
                  - name
                  type: object
                type: array
              enabled:
                default: true
                type: boolean
              endpoints:
                description: Ordered static origins. Hints order equivalent origins; they do not widen the node selector or confer trust.
                items:
                  properties:
                    allowInsecureHttp:
                      default: false
                      type: boolean
                    baseUrl:
                      description: User-provided static HTTP(S) origin. There is intentionally no default origin owned by the project or any cloud provider.
                      type: string
                    priority:
                      default: 0
                      format: uint32
                      minimum: 0.0
                      type: integer
                    topologyHints:
                      default:
                        availabilityZones: []
                        cloudProviders: []
                        regions: []
                      properties:
                        availabilityZones:
                          default: []
                          items:
                            type: string
                          type: array
                        cloudProviders:
                          default: []
                          items:
                            type: string
                          type: array
                        regions:
                          default: []
                          items:
                            type: string
                          type: array
                      type: object
                  required:
                  - baseUrl
                  type: object
                type: array
              nodeSelector:
                additionalProperties:
                  type: string
                default: {}
                description: Only nodes matching these labels may use this source policy. An empty selector applies cluster-wide, which is convenient for a single-region cluster but should be used deliberately in a shared regional cluster.
                type: object
              trustedPublicKeyRefs:
                description: Public verification keys. These are not secret data, but ConfigMaps allow a regional administrator to rotate them without rebuilding Pods.
                items:
                  properties:
                    key:
                      type: string
                    name:
                      type: string
                    namespace:
                      type: string
                  required:
                  - key
                  - name
                  - namespace
                  type: object
                type: array
            required:
            - catalogRefs
            - endpoints
            - trustedPublicKeyRefs
            type: object
          status:
            nullable: true
            properties:
              message:
                nullable: true
                type: string
              observedGeneration:
                format: int64
                nullable: true
                type: integer
              phase:
                default: ''
                type: string
            type: object
        required:
        - spec
        title: ZccusanKernelModuleSource
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
