apiVersion: v1
kind: Pod
metadata:
  name: zc-mirror-pgbench
  namespace: zccusan
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: storage.zcutils.io/example-client
                operator: In
                values:
                  - "true"
  containers:
    - name: pgbench
      image: docker.io/robjcaskey/zccusan-storage-test:0.1.4
      imagePullPolicy: IfNotPresent
      command: [/bin/bash, -ec]
      args:
        - |
          export PGDATA=/data/postgres
          export PGHOST=/tmp
          mkdir -p "${PGDATA}"
          if [ ! -s "${PGDATA}/PG_VERSION" ]; then
            initdb --auth=trust --encoding=UTF8 --no-locale
          fi
          pg_ctl -w start -o "-c listen_addresses= -c unix_socket_directories=/tmp -c min_wal_size=32MB -c max_wal_size=128MB"
          trap 'pg_ctl -m fast -w stop' EXIT
          if ! psql --dbname=postgres --tuples-only --command \
            "SELECT 1 FROM pg_database WHERE datname = 'pgbench'" | grep -q 1
          then
            createdb pgbench
            pgbench --initialize --scale=1 pgbench
          fi
          pgbench --client=8 --jobs=4 --time=30 --progress=5 pgbench
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: zc-mirror
    - name: tmp
      emptyDir:
        sizeLimit: 64Mi
