apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zc-mirror
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: zc-mirror-ram
  resources:
    requests:
      storage: 128Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: zc-mirror-fio
spec:
  restartPolicy: Never
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: storage.zcutils.io/getting-started-leaf
                operator: DoesNotExist
  containers:
    - name: fio
      image: docker.io/library/debian:bookworm-slim
      command: [/bin/sh, -ec]
      args:
        - |
          apt-get update >&2
          apt-get install -y --no-install-recommends fio >&2
          fio \
            --name=zc-mirror-randrw \
            --filename=/data/fio.bin \
            --size=96Mi \
            --rw=randrw \
            --rwmixread=70 \
            --bs=4k \
            --ioengine=libaio \
            --iodepth=16 \
            --direct=1 \
            --runtime=30 \
            --time_based=1 \
            --group_reporting=1 \
            --output-format=json
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: zc-mirror
