# Replace EXAMPLE_SERVER_A_NODE, EXAMPLE_SERVER_A_PARTUUID,
# EXAMPLE_SERVER_B_NODE, and EXAMPLE_SERVER_B_PARTUUID
# before applying this file. Each PARTUUID must identify a dedicated, empty
# partition on its named node. allowRawWrites is intentionally never defaulted
# to true.
apiVersion: storage.zcutils.io/v1alpha1
kind: MediaGrant
metadata:
  name: getting-started-block
spec:
  nodeSelector:
    matchLabels:
      storage.zcutils.io/example-server: "true"
  mediaSets:
    - name: explicit-partitions
      staticSources:
        - kind: BlockDevice
          nodeName: EXAMPLE_SERVER_A_NODE
          partUuid: EXAMPLE_SERVER_A_PARTUUID
          destructivePreparation:
            allowRawWrites: true
        - kind: BlockDevice
          nodeName: EXAMPLE_SERVER_B_NODE
          partUuid: EXAMPLE_SERVER_B_PARTUUID
          destructivePreparation:
            allowRawWrites: true
      publishAs:
        mediaClass: getting-started-block
        durability: Persistent
        mayContributeToDurableAcknowledgement: true
---
apiVersion: storage.zcutils.io/v1alpha1
kind: StorageProfile
metadata:
  name: getting-started-mirror-block
spec:
  storageClass:
    name: zc-mirror-block
  frontend: LinuxBlock
  placement:
    primitive: Mirror
    execution: Userspace
    copies: 2
    mediaClass: getting-started-block
    excludeClientNode: false
    distinctTopologyKeys:
      - kubernetes.io/hostname
  transport:
    kind: TcpMux
    addressSource: NodeAnnotationThenInternalIP
    nodeAddressAnnotation: storage.zcutils.io/backplane-address
    lanes: 1
    connectionsPerLane: 1
    chunkBytes: 4096
