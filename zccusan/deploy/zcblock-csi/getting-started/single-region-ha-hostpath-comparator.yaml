apiVersion: v1
kind: Pod
metadata:
  name: zc-single-region-ha-hostpath
  namespace: zccusan
  labels:
    app.kubernetes.io/name: zc-single-region-ha-hostpath
spec:
  restartPolicy: Always
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: storage.zcutils.io/example-server
                operator: In
                values: ["true"]
  containers:
    - name: writer
      image: docker.io/robjcaskey/zccusan-storage-test:0.1.6
      imagePullPolicy: IfNotPresent
      command: [/bin/bash, -ec]
      args:
        - |
          sequence="$(cat /data/sequence 2>/dev/null || echo 0)"
          [[ "${sequence}" =~ ^[0-9]+$ ]]
          while true; do
            sequence=$((sequence + 1))
            printf '%s\n' "${sequence}" > /data/sequence.next
            mv /data/sequence.next /data/sequence
            printf '{"event":"hostpath_commit","sequence":%d}\n' "${sequence}"
            sleep 0.25
          done
      readinessProbe:
        exec:
          command: [/bin/bash, -ec, test -s /data/sequence]
        periodSeconds: 1
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      hostPath:
        path: /var/lib/zccusan-reliability-hostpath
        type: DirectoryOrCreate
