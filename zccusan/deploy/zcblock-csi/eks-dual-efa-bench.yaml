apiVersion: v1
kind: Namespace
metadata:
  name: zccusan-perf
---
apiVersion: v1
kind: Service
metadata:
  name: zc-efa-bench
  namespace: zccusan-perf
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: zc-efa-bench
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zc-efa-bench
  namespace: zccusan-perf
spec:
  serviceName: zc-efa-bench
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: zc-efa-bench
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zc-efa-bench
    spec:
      hostNetwork: true
      hostPID: true
      hostIPC: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        zcutils.io/perf: dual-efa
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: zc-efa-bench
              topologyKey: kubernetes.io/hostname
      terminationGracePeriodSeconds: 1
      containers:
        - name: bench
          image: docker.io/robjcaskey/zcutils-efa-bench:eks-20260820-r1@sha256:9ce27ed6eddff84b7ebde71ce4fe0fc0c3b4286066f0f284b0ce74174b77d9a0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-lc", "exec sleep infinity"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: dev
              mountPath: /dev
            - name: host-sys
              mountPath: /host-sys
            - name: host-proc
              mountPath: /host-proc
            - name: hugepages
              mountPath: /dev/hugepages
      volumes:
        - name: dev
          hostPath:
            path: /dev
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: hugepages
          hostPath:
            path: /dev/hugepages
            type: DirectoryOrCreate
