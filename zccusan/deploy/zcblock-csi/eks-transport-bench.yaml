apiVersion: v1
kind: Pod
metadata:
  name: zc-transport-target
  namespace: zccusan-ram-xnode
  labels:
    app.kubernetes.io/name: zc-transport-bench
    zcutils.io/bench-role: target
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  nodeSelector:
    zccusan.io/role: ram-leaf
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
    - name: bench
      image: ubuntu:24.04
      command: ["/bin/sh", "-lc", "exec sleep infinity"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: dev
          mountPath: /dev
        - name: sys
          mountPath: /host-sys
          readOnly: true
  volumes:
    - name: dev
      hostPath:
        path: /dev
        type: Directory
    - name: sys
      hostPath:
        path: /sys
        type: Directory
---
apiVersion: v1
kind: Pod
metadata:
  name: zc-transport-client
  namespace: zccusan-ram-xnode
  labels:
    app.kubernetes.io/name: zc-transport-bench
    zcutils.io/bench-role: client
spec:
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  nodeSelector:
    zccusan.io/role: block-client
  restartPolicy: Never
  terminationGracePeriodSeconds: 1
  containers:
    - name: bench
      image: ubuntu:24.04
      command: ["/bin/sh", "-lc", "exec sleep infinity"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: dev
          mountPath: /dev
        - name: sys
          mountPath: /host-sys
          readOnly: true
  volumes:
    - name: dev
      hostPath:
        path: /dev
        type: Directory
    - name: sys
      hostPath:
        path: /sys
        type: Directory
