[package]
name = "zcsecret-materialize"
version = "0.1.0"
edition = "2024"
publish = false
description = "Minimal passwordless secret-provider materializer for zcutils"
license = "MIT OR Apache-2.0 OR BSD-2-Clause"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "zcsecret-materialize"
path = "../../src/bin/zcsecret-materialize.rs"
