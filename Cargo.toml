[package]
name = "zcutils"
version = "0.1.2"
edition = "2024"
autobins = false
description = "Linux zero-copy descriptor stream and io_uring utility experiments"
readme = "README.md"
license = "MIT OR Apache-2.0 OR BSD-2-Clause"

[dependencies]
arc-swap = "1.7"
aws-lc-rs = "1.15"
futures = "0.3"
k8s-csi = "0.4.0"
hdrhistogram = { version = "7.6", default-features = false }
k8s-openapi = { version = "0.22", features = ["v1_30"] }
kube = { version = "0.94.2", default-features = false, features = ["client", "derive", "runtime", "rustls-tls"] }
libc = "0.2"
prost = "0.8"
prost-types = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
schemars = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
sha2 = "0.10"
tokio = { version = "1.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.5", features = ["transport"] }
vhost = { version = "0.17", features = ["vhost-user-backend"] }
vhost-user-backend = "0.23"
virtio-bindings = "0.2.7"
virtio-queue = "0.18"
vm-memory = { version = "0.18", features = ["backend-mmap", "backend-atomic", "backend-bitmap"] }
vmm-sys-util = "0.15"

[[bin]]
name = "zcutils"
path = "src/main.rs"

[[bin]]
name = "zcracing-mirror"
path = "src/bin/zcracing-mirror.rs"

[[bin]]
