name: AWS-LC 5314 provider build
run-name: AWS-LC 5314 provider ${{ inputs.runner_label }}

on:
  workflow_dispatch:
    inputs:
      compare_online:
        description: Explicit same-machine experiment; normal releases compile offline only
        type: boolean
        default: false
      runner_label:
        description: Unique label produced by scripts/test-github-ec2-runner.py --fips-build
        required: true
        type: string
      jit_secret_name:
        description: Temporary repository secret containing the one-job runner configuration
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fips-aws-lc-5314
  cancel-in-progress: false

env:
  FIPS_COMPARE_ONLINE: ${{ inputs.compare_online && '1' || '0' }}
  RUNNER_CONFIG_JSON: ${{ vars.AWS_FIPS_RUNNER_CONFIG }}
  EXPECTED_ROLE_ARN: ${{ vars.AWS_FIPS_RUNNER_ROLE_ARN }}
  AWS_LC_ARCHIVE_URL: https://github.com/aws/aws-lc/archive/refs/tags/AWS-LC-FIPS-3.1.0.zip
  AWS_LC_ARCHIVE_SHA256: fe408fa438850786396faf79eba9ea4116c3802e60f3a95865f0dd2adb64c9f1
  RUNNER_CACHE_VOLUME_ID: ${{ vars.AWS_FIPS_RUNNER_CACHE_VOLUME_ID }}
  RUNNER_CACHE_AVAILABILITY_ZONE: ${{ vars.AWS_FIPS_RUNNER_CACHE_AVAILABILITY_ZONE }}
  RUNNER_CACHE_ALLOW_FORMAT_EMPTY: ${{ vars.AWS_FIPS_RUNNER_CACHE_ALLOW_FORMAT_EMPTY || 'false' }}
  RUNNER_CACHE_ENABLE_SQUID: ${{ vars.AWS_FIPS_RUNNER_CACHE_ENABLE_SQUID || 'false' }}

jobs:
  launch:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
      id-token: write
    outputs:
      instance_id: ${{ steps.worker.outputs.instance_id }}
      runner_label: ${{ steps.worker.outputs.runner_label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/github-ec2-runner-smoke.py
          sparse-checkout-cone-mode: false
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_FIPS_RUNNER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_FIPS_RUNNER_REGION }}
          allowed-account-ids: ${{ vars.AWS_FIPS_RUNNER_ACCOUNT_ID }}
          role-session-name: gha-5314-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
      - name: Verify the selected AMI at launch time
        run: |
          set -euo pipefail
          image="$(aws ec2 describe-images --image-ids ami-0354c98ae10b02961 \
            --query 'Images[0].[OwnerId,Architecture,State,Name]' --output text)"
          test "$image" = $'137112412989\tx86_64\tavailable\tal2023-ami-2023.12.20260909.0-kernel-6.18-x86_64'
      - name: Launch the certificate-profile worker
        id: worker
        env:
          RUNNER_LABEL: ${{ inputs.runner_label }}
          RUNNER_JIT_CONFIG: ${{ secrets[inputs.jit_secret_name] }}
          RUNNER_IMAGE_ID: ami-0354c98ae10b02961
          RUNNER_INSTANCE_TYPE: c6i.metal
          RUNNER_LIFETIME_MINUTES: "45"
        run: python3 scripts/github-ec2-runner-smoke.py launch
      - name: Save launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 5314-runner-launch-${{ github.run_id }}
          path: ${{ runner.temp }}/ec2-runner-smoke/launch.json
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: Build AWS-LC FIPS 3.1.0 offline
    needs: launch
    runs-on: ${{ needs.launch.outputs.runner_label }}
    timeout-minutes: 38
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify the actual build environment
        env:
          EXPECTED_INSTANCE_ID: ${{ needs.launch.outputs.instance_id }}
        run: |
          set -euo pipefail
          token="$(curl -fsS -X PUT -H 'X-aws-ec2-metadata-token-ttl-seconds: 60' http://169.254.169.254/latest/api/token)"
          metadata() { curl -fsS -H "X-aws-ec2-metadata-token: $token" "http://169.254.169.254/latest/meta-data/$1"; }
          test "$(metadata instance-id)" = "$EXPECTED_INSTANCE_ID"
          test "$(metadata ami-id)" = "ami-0354c98ae10b02961"
          test "$(metadata instance-type)" = "c6i.metal"
          test "$(cat /sys/class/dmi/id/sys_vendor)" = "Amazon EC2"
          test "$(cat /sys/class/dmi/id/product_name)" = "c6i.metal"
          grep -Fq 'Intel(R) Xeon(R) Platinum 8375C' /proc/cpuinfo
          . /etc/os-release
          test "$ID" = amzn
          test "$VERSION_ID" = 2023
          uname -a
          rustc -Vv
          cargo -V
          cmake3 --version
          go version
          docker version
          curl -fsS http://127.0.0.1:5000/v2/
      - name: Set up the pinned loopback-cache BuildKit daemon
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
            network=host
          buildkitd-config: config/buildkit-loopback-registry.toml
      - name: Reproduce the section 11.1 module and provider package
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 15 "$AWS_LC_ARCHIVE_URL" -o "$RUNNER_TEMP/AWS-LC-FIPS-3.1.0.zip"
          printf '%s  %s\n' "$AWS_LC_ARCHIVE_SHA256" "$RUNNER_TEMP/AWS-LC-FIPS-3.1.0.zip" | sha256sum -c -
          compare_args=()
          if [[ "$FIPS_COMPARE_ONLINE" == 1 ]]; then compare_args+=(--compare-online); fi
          python3 scripts/fips-reproducible-provider.py \
            --archive "$RUNNER_TEMP/AWS-LC-FIPS-3.1.0.zip" \
            --work-dir "$RUNNER_TEMP/aws-lc-5314-work" \
            --provider-dir "$GITHUB_WORKSPACE/zccusan/deploy/zcblock-csi/fips/provider" \
            --report "$RUNNER_TEMP/aws-lc-5314-native.json" "${compare_args[@]}"
      - name: Preserve failed native comparison outputs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-comparison-failure-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/aws-lc-5314-work/*.json
            ${{ runner.temp }}/aws-lc-5314-work/online/**/libcrypto.a
            ${{ runner.temp }}/aws-lc-5314-work/offline/**/libcrypto.a
            ${{ runner.temp }}/aws-lc-5314-work/online/**/bcm.o
            ${{ runner.temp }}/aws-lc-5314-work/offline/**/bcm.o
          if-no-files-found: ignore
          retention-days: 14
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.5.3
      - name: Assume the dedicated attestation signer role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ATTESTATION_SIGNER_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '968134102381'
          role-session-name: fips-attest-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
      - name: Log in for the one final image push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'robjcaskey' }}
          password: ${{ secrets.ZCCUSAN_DOCKERHUB_PAT || secrets.DOCKERHUB_PAT || secrets.DOCKERHUB_TOKEN }}
      - name: Build, publish, sign, and attest the FIPS-aspiring image
        env:
          FIPS_PROVIDER_ROOT: zccusan/deploy/zcblock-csi/fips/provider
          BUILD_JOBS: '32'
          CACHE_BUILDER_IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          : "${ZCUTILS_CACHE_REF:?persistent loopback registry was not configured}"
          short_sha="${GITHUB_SHA:0:12}"
          image="docker.io/robjcaskey/zcblock-csi:fips-aspiring-5314-sha-${short_sha}-run-${GITHUB_RUN_ID}"
          cache_args=()
          cache_url="http://127.0.0.1:5000/v2/zcutils/zcblock-csi-buildcache/manifests/trusted"
          if curl -fsS --head "${cache_url}" >/dev/null; then
            cache_args+=(
              --cache-from "${ZCUTILS_CACHE_REF}"
              --cache-verification-key awskms:///alias/zcutils-build-attestation-signing-authority-Rob-J-Caskey
            )
          fi
          python3 scripts/zc-image-attest.py generate \
            --variant fips-aspiring \
            --image "${image}" \
            --output-dir "$RUNNER_TEMP/fips-image-attestations" \
            --kms-key-parameter \
            --push-image \
            --sign-image \
            --provider-only-fips-check \
            --cache-export-ref "${ZCUTILS_CACHE_REF}" \
            --cache-builder-identity "${CACHE_BUILDER_IDENTITY}" \
            --sign-cache-export \
            --allow-insecure-loopback-registry \
            "${cache_args[@]}"
          printf '%s\n' "${image}" > "$RUNNER_TEMP/fips-image-ref.txt"
      - name: Extract and verify the selected offline artifacts
        run: |
          set -euo pipefail
          image="$(cat "$RUNNER_TEMP/fips-image-ref.txt")"
          container="$(docker create "$image")"
          trap 'docker rm "$container" >/dev/null' EXIT
          mkdir -p "$RUNNER_TEMP/linked-bin" "$RUNNER_TEMP/link-evidence"
          docker cp "$container:/usr/local/bin/." "$RUNNER_TEMP/linked-bin/"
          docker cp "$container:/usr/share/zcutils/fips/." "$RUNNER_TEMP/link-evidence/"
          docker run --rm --network none --entrypoint /usr/local/bin/zc-fips-check "$image" --require-fips > "$RUNNER_TEMP/zc-fips-check.json"
          python3 scripts/fips-build-reproducibility.py verify \
            --binaries "$RUNNER_TEMP/linked-bin" \
            --report "$RUNNER_TEMP/link-evidence/offline-build.json"
      - name: Assemble hash-bound evidence
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/fips-artifact"
          mkdir -p "$artifact/evidence" "$artifact/bin"
          cp -a zccusan/deploy/zcblock-csi/fips/provider "$artifact/provider"
          cp -a "$RUNNER_TEMP/linked-bin/." "$artifact/bin/"
          cp "$RUNNER_TEMP/aws-lc-5314-native.json" "$artifact/evidence/"
          cp "$RUNNER_TEMP/zc-fips-check.json" "$artifact/evidence/"
          cp -a "$RUNNER_TEMP/link-evidence/." "$artifact/evidence/"
          if [[ "$FIPS_COMPARE_ONLINE" == 1 ]]; then
            cp "$RUNNER_TEMP/aws-lc-5314-work/provider-reproducibility.json" "$artifact/evidence/"
            cp "$RUNNER_TEMP/aws-lc-5314-work/online.json" "$artifact/evidence/provider-online.json"
          fi
          cp "$RUNNER_TEMP/fips-image-ref.txt" "$artifact/evidence/"
          cp -a "$RUNNER_TEMP/fips-image-attestations" "$artifact/image-attestations"
          (cd "$artifact" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/files.sha256"
          mv "$RUNNER_TEMP/files.sha256" "$artifact/evidence/files.sha256"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aws-lc-fips-5314-x86_64-${{ github.run_id }}
          path: ${{ runner.temp }}/fips-artifact/
          if-no-files-found: error
          retention-days: 14

  cleanup:
    needs: [launch, build]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # c6i.metal termination has taken more than 20 minutes in practice.
    timeout-minutes: 38
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/github-ec2-runner-smoke.py
          sparse-checkout-cone-mode: false
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_FIPS_RUNNER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_FIPS_RUNNER_REGION }}
          allowed-account-ids: ${{ vars.AWS_FIPS_RUNNER_ACCOUNT_ID }}
          role-session-name: gha-5314-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
      - name: Confirm termination and remove the deadline schedule
        env:
          RUNNER_CLEANUP_TIMEOUT_SECONDS: "1800"
        run: python3 scripts/github-ec2-runner-smoke.py cleanup
      - name: Save cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: 5314-runner-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/ec2-runner-smoke/cleanup.json
          if-no-files-found: error
          retention-days: 14
