name: DriverKit development build
on:
  push:
    branches: [codex/macos-driverkit]
    paths: ['macos/**', 'src/macos_scsi.rs', 'src/bin/zcnblk-macos-client.rs', 'Cargo.*', 'scripts/build-macos-driverkit.sh', '.github/workflows/driverkit.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: driverkit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      PROTOC: protoc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build native extension and activation app
        run: bash scripts/build-macos-driverkit.sh
      - name: Install protocol compiler
        run: brew list protobuf >/dev/null 2>&1 || brew install protobuf
      - name: Build and test userspace broker
        run: |
          cargo build --locked --bin zcnblk-macos-client
          cargo test --locked --bin zcnblk-macos-client
          codesign --force --sign - --entitlements macos/driverkit/Broker.entitlements target/debug/zcnblk-macos-client
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zcutils-driverkit-development
          path: |
            target/macos-driverkit/ZcStorage.app
            target/debug/zcnblk-macos-client
          retention-days: 7
