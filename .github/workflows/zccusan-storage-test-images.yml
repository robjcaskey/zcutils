name: zccusan storage-test image

on:
  pull_request:
    paths:
      - '.github/workflows/zccusan-storage-test-images.yml'
      - 'zccusan/deploy/zcblock-csi/getting-started/Dockerfile.storage-test'
      - 'zccusan/deploy/zcblock-csi/getting-started/mirror-fio.yaml'
      - 'zccusan/deploy/zcblock-csi/getting-started/mirror-pgbench.yaml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '.github/workflows/zccusan-storage-test-images.yml'
      - 'zccusan/deploy/zcblock-csi/getting-started/Dockerfile.storage-test'
      - 'zccusan/deploy/zcblock-csi/getting-started/mirror-fio.yaml'
      - 'zccusan/deploy/zcblock-csi/getting-started/mirror-pgbench.yaml'
  schedule:
    - cron: '45 4 * * *'
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref to build (defaults to the triggering ref)
        required: false
        type: string
      image_tag:
        description: Additional image tag
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Compute image tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REQUESTED_TAG: ${{ inputs.image_tag }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA::7}"
          tags="sha-${short_sha}"
          if [ "${EVENT_NAME}" = pull_request ]; then
            tags="pr-${PR_NUMBER}-sha-${short_sha}"
          elif [ -n "${REQUESTED_TAG}" ]; then
            [[ "${REQUESTED_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]
            tags="${tags},${REQUESTED_TAG}"
          elif [ "${EVENT_NAME}" = schedule ]; then
            tags="${tags},nightly,nightly-$(date -u +%Y%m%d)"
          elif [ "${REF_TYPE}" = tag ]; then
            version="${REF_NAME#v}"
            [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            tags="${tags},${version}"
          elif [ "${REF_NAME}" = main ]; then
            tags="${tags},main,latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, platform: linux/amd64, runner: ubuntu-24.04}
          - {arch: arm64, platform: linux/arm64, runner: ubuntu-24.04-arm}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'robjcaskey' }}
          password: ${{ secrets.ZCCUSAN_DOCKERHUB_PAT || secrets.DOCKERHUB_PAT || secrets.DOCKERHUB_TOKEN }}
      - name: Compute architecture tags
        id: arch_tags
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
          ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          output=()
          IFS=',' read -r -a tags <<< "${TAGS}"
          for tag in "${tags[@]}"; do
            output+=("docker.io/robjcaskey/zccusan-storage-test:${tag}-${ARCH}")
          done
          echo "tags=$(IFS=,; echo "${output[*]}")" >> "$GITHUB_OUTPUT"
      - name: Build architecture image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: zccusan/deploy/zcblock-csi/getting-started/Dockerfile.storage-test
          platforms: ${{ matrix.platform }}
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.arch_tags.outputs.tags }}
          labels: |
            org.opencontainers.image.title=zccusan-storage-test
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.prepare.outputs.source_sha }}
          provenance: false
          sbom: false
      - name: Smoke-test fio and PostgreSQL tools
        env:
          IMAGE_TAGS: ${{ steps.arch_tags.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_TAGS%%,*}"
          if [ "${{ github.event_name }}" != pull_request ]; then docker pull "${image}"; fi
          docker run --rm "${image}" fio --version
          docker run --rm "${image}" pgbench --version
          docker run --rm "${image}" postgres --version
          docker run --rm --read-only --tmpfs /tmp:rw,size=512m \
            --entrypoint /bin/bash "${image}" -ec '
              export PGDATA=/tmp/postgres PGHOST=/tmp
              initdb --auth=trust --encoding=UTF8 --no-locale >/dev/null
              pg_ctl -w start -o "-c listen_addresses= -c unix_socket_directories=/tmp" >/dev/null
              trap '\''pg_ctl -m fast -w stop >/dev/null'\'' EXIT
              createdb pgbench
              pgbench --initialize --scale=1 pgbench >/dev/null
              pgbench --client=2 --jobs=2 --transactions=2 pgbench >/dev/null
            '
          printf 'ZCCUSAN_STORAGE_TEST_IMAGE_SMOKE_PASS arch=%s image=%s tools=fio,postgres,pgbench\n' \
            '${{ matrix.arch }}' "${image}"

  publish-manifests:
    name: Publish and sign multi-architecture manifests
    if: github.event_name != 'pull_request'
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'robjcaskey' }}
          password: ${{ secrets.ZCCUSAN_DOCKERHUB_PAT || secrets.DOCKERHUB_PAT || secrets.DOCKERHUB_TOKEN }}
      - name: Publish multi-architecture manifests
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a tags <<< "${TAGS}"
          for tag in "${tags[@]}"; do
            image="docker.io/robjcaskey/zccusan-storage-test:${tag}"
            docker buildx imagetools create --tag "${image}" "${image}-amd64" "${image}-arm64"
          done
      - uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.5.3'
      - name: Sign published manifests
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a tags <<< "${TAGS}"
          for tag in "${tags[@]}"; do
            cosign sign --yes "docker.io/robjcaskey/zccusan-storage-test:${tag}"
          done
      - name: Print manifests
        env:
          TAGS: ${{ needs.prepare.outputs.tags }}
        shell: bash
        run: |
          IFS=',' read -r -a tags <<< "${TAGS}"
          for tag in "${tags[@]}"; do
            docker buildx imagetools inspect "docker.io/robjcaskey/zccusan-storage-test:${tag}"
          done
