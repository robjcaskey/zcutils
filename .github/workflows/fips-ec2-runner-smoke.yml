name: Ephemeral EC2 runner smoke
run-name: Ephemeral runner smoke ${{ inputs.runner_label }}

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Unique label produced by scripts/test-github-ec2-runner.py
        required: true
        type: string
      jit_secret_name:
        description: Temporary repository secret containing the one-job runner configuration
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fips-ec2-runner-smoke
  cancel-in-progress: false

env:
  RUNNER_CONFIG_JSON: ${{ vars.AWS_FIPS_RUNNER_CONFIG }}
  EXPECTED_ROLE_ARN: ${{ vars.AWS_FIPS_RUNNER_ROLE_ARN }}

jobs:
  launch:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      contents: read
      id-token: write
    outputs:
      instance_id: ${{ steps.worker.outputs.instance_id }}
      runner_label: ${{ steps.worker.outputs.runner_label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/github-ec2-runner-smoke.py
          sparse-checkout-cone-mode: false
      - name: Assume the restricted AWS controller role
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_FIPS_RUNNER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_FIPS_RUNNER_REGION }}
          allowed-account-ids: ${{ vars.AWS_FIPS_RUNNER_ACCOUNT_ID }}
          role-session-name: gha-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
      - name: Launch one worker and verify its termination schedule
        id: worker
        env:
          RUNNER_LABEL: ${{ inputs.runner_label }}
          RUNNER_JIT_CONFIG: ${{ secrets[inputs.jit_secret_name] }}
        run: python3 scripts/github-ec2-runner-smoke.py launch
      - name: Save launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-launch-${{ github.run_id }}
          path: ${{ runner.temp }}/ec2-runner-smoke/launch.json
          if-no-files-found: ignore
          retention-days: 3

  hello:
    name: Produce hello world on EC2
    needs: launch
    runs-on: ${{ needs.launch.outputs.runner_label }}
    timeout-minutes: 4
    steps:
      - name: Produce the artifact and identify its EC2 worker
        env:
          EXPECTED_INSTANCE_ID: ${{ needs.launch.outputs.instance_id }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, platform, urllib.request
          base = 'http://169.254.169.254/latest/'
          req = urllib.request.Request(base + 'api/token', method='PUT', headers={'X-aws-ec2-metadata-token-ttl-seconds': '60'})
          token = urllib.request.urlopen(req, timeout=5).read().decode()
          def metadata(key):
              req = urllib.request.Request(base + 'meta-data/' + key, headers={'X-aws-ec2-metadata-token': token})
              return urllib.request.urlopen(req, timeout=5).read().decode()
          instance_id = metadata('instance-id')
          assert instance_id == os.environ['EXPECTED_INSTANCE_ID']
          out = pathlib.Path('hello-artifact')
          out.mkdir()
          (out / 'hello.txt').write_text('Hello, world!\n')
          evidence = {'instance_id': instance_id, 'ami_id': metadata('ami-id'), 'hostname': platform.node(),
                      'runner_name': os.environ['RUNNER_NAME'], 'github_run_id': os.environ['GITHUB_RUN_ID'],
                      'os_release': pathlib.Path('/etc/redhat-release').read_text().strip()}
          (out / 'worker.json').write_text(json.dumps(evidence, indent=2) + '\n')
          print(json.dumps(evidence))
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hello-world-${{ github.run_id }}
          path: hello-artifact/
          if-no-files-found: error
          retention-days: 3

  download:
    name: Download and verify hello world
    needs: [launch, hello]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hello-world-${{ github.run_id }}
          path: downloaded
      - name: Verify content and worker identity
        env:
          EXPECTED_INSTANCE_ID: ${{ needs.launch.outputs.instance_id }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path('downloaded')
          assert (root / 'hello.txt').read_text() == 'Hello, world!\n'
          evidence = json.loads((root / 'worker.json').read_text())
          assert evidence['instance_id'] == os.environ['EXPECTED_INSTANCE_ID']
          print('Downloaded and verified hello-world artifact from', evidence['instance_id'])
          PY

  cleanup:
    needs: [launch, hello, download]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/github-ec2-runner-smoke.py
          sparse-checkout-cone-mode: false
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_FIPS_RUNNER_ROLE_ARN }}
          aws-region: ${{ vars.AWS_FIPS_RUNNER_REGION }}
          allowed-account-ids: ${{ vars.AWS_FIPS_RUNNER_ACCOUNT_ID }}
          role-session-name: gha-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
      - name: Confirm termination and remove the per-run schedule
        run: python3 scripts/github-ec2-runner-smoke.py cleanup
      - name: Save cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runner-cleanup-${{ github.run_id }}
          path: ${{ runner.temp }}/ec2-runner-smoke/cleanup.json
          if-no-files-found: error
          retention-days: 3
